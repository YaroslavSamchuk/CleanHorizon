schema = 1
id = "complementary_unbound"
name = "Complementary Unbound"
version = "1.0.0"
api = "0.1"
description = "Native Horizon port of the iconic Complementary Unbound shader pack style: ACES filmic tonemapping, warm atmospheric sunlight, atmospheric sky scattering, and cinematic color grading written in pure WGSL."
authors = ["EminGT (Original Style)", "Horizon Port"]
license = "Custom"
shared = ["common.wgsl"]

[sky]
file = "sky.wgsl"

[material]
file = "material.wgsl"
name = "Unbound Terrain"

[[post]]
file = "post/grade.wgsl"
name = "ACES Color Grading"

[[post]]
file = "post/vignette.wgsl"
name = "Cinematic Vignette"

[[options]]
id = "tonemap"
name = "Tone Mapping"
description = "The tone mapping operator. ACES Filmic is the classic Complementary Unbound filmic curve."
type = "choice"
values = ["None", "ACES Filmic", "Soft"]
default = "ACES Filmic"

[[options]]
id = "saturation"
name = "Color Saturation"
description = "How vivid and colorful the world appears."
type = "float"
default = 1.2
min = 0.5
max = 2.0
step = 0.05

[[options]]
id = "warmth"
name = "Sunlight Warmth"
description = "Overall color temperature of direct sunlight and sky."
type = "float"
default = 1.05
min = 0.8
max = 1.3
step = 0.05

[[options]]
id = "block_light_warmth"
name = "Block Light Warmth"
description = "Warmth and intensity of lanterns, torches and campfires."
type = "float"
default = 1.15
min = 0.8
max = 1.5
step = 0.05

[[options]]
id = "ambient_contrast"
name = "Ambient Contrast"
description = "Depth and contrast of shadow areas."
type = "float"
default = 1.2
min = 0.8
max = 1.8
step = 0.05

[[options]]
id = "sky_glow"
name = "Atmospheric Sky Glow"
description = "Intensity of the sun and celestial atmospheric scattering."
type = "float"
default = 0.6
min = 0.0
max = 1.5
step = 0.05

[[options]]
id = "vignette_strength"
name = "Vignette Strength"
description = "Soft optical darkening at the edges of the screen."
type = "float"
default = 0.25
min = 0.0
max = 0.8
step = 0.05

[budget]
gpu_ms = 1.5
